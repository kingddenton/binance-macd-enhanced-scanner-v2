.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px;font-size:12px}
th,td{padding:9px 7px;text-align:left;border-bottom:1px solid #263750;white-space:nowrap}

<div class="note">
Both Primary MACD timeframes are scanned independently. Each has its own Bar 1–window crossover count and separate result section. The same selected confirmation matrix is applied to both.
All indicators use Binance's latest returned candle, including the currently forming candle. Live values can change before candle close.
Enabled MACD confirmation timeframes are classified automatically: histogram above zero is bullish, below zero is bearish, exactly zero is neutral. All enabled timeframes must agree for each primary candidate.
Enabled Supertrend confirmation timeframes must all agree with the result direction.
Each enabled RSI timeframe has independent bullish minimum/maximum and bearish minimum/maximum ranges. All enabled RSI timeframes must fall inside the relevant range.
Mixed bullish/bearish confirmations do not qualify for either side.
Every selected DEA confirmation timeframe is checked independently: DEA above zero confirms bullish, below zero confirms bearish, exactly zero confirms neither. All selected DEA timeframes must agree. The separate DIF / DEA zero-line filters use the timeframe selected above.
DIF and DEA zero-line filters remain independently optional.
MACD uses standard 12, 26, 9 settings. Supertrend uses ATR 10, multiplier 3.
</div>
</section>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const API=['https://fapi.binance.com','https://fapi1.binance.com','https://fapi2.binance.com'];
let running=false,busy=false,timer=null;
let lastResults={bullA:[],bullB:[],bullC:[],bullD:[],bearA:[],bearB:[],bearC:[],bearD:[]};
let activeController=null,scanToken=0,rateLimitedUntil=0;
let requestQueue=[],activeRequests=0,lastRequestAt=0,queueTimer=null;
let requestErrors=0,scanStartedAt=0,progressTotal=0,progressDone=0;

/* Balanced request throughput while keeping well below typical Binance weight limits. */
const MAX_WORKERS=6,REQUEST_GAP_MS=150,REQUEST_TIMEOUT_MS=15000;

class BinanceRateLimitError extends Error{
 constructor(status,waitSeconds){
  super('Binance HTTP '+status+'. Requests paused for '+waitSeconds+' seconds.');
  this.name='BinanceRateLimitError';this.status=status;this.waitSeconds=waitSeconds;
 }
}
function makeAbortError(){const e=new Error('Scan stopped');e.name='AbortError';return e;}

function clearQueuedRequests(error){
 const queued=requestQueue.splice(0);
 queued.forEach(job=>job.reject(error||makeAbortError()));
 if(queueTimer){clearTimeout(queueTimer);queueTimer=null;}
}

function pauseForRateLimit(status,retryAfter){
 let waitSeconds=status===418?120:60;
 if(retryAfter){
  const n=Number(retryAfter);
  if(Number.isFinite(n)&&n>0)waitSeconds=Math.ceil(n);
  else{
   const d=Date.parse(retryAfter);
   if(Number.isFinite(d))waitSeconds=Math.max(1,Math.ceil((d-Date.now())/1000));
  }
 }
 rateLimitedUntil=Date.now()+waitSeconds*1000;
 const error=new BinanceRateLimitError(status,waitSeconds);
 clearQueuedRequests(error);
 running=false;
 if(timer){clearTimeout(timer);clearInterval(timer);timer=null;}
 if(activeController&&!activeController.signal.aborted)activeController.abort();
 $('startBtn').classList.remove('scanning');
 $('startBtn').textContent='Start scanning';
 $('state').textContent=error.message;
 return error;
}

function pumpRequestQueue(){
 if(queueTimer){clearTimeout(queueTimer);queueTimer=null;}
 if(Date.now()<rateLimitedUntil)return;
 while(activeRequests<MAX_WORKERS&&requestQueue.length){
  const wait=REQUEST_GAP_MS-(Date.now()-lastRequestAt);
  if(wait>0){queueTimer=setTimeout(pumpRequestQueue,wait);return;}
  const job=requestQueue.shift();
  if(job.signal&&job.signal.aborted){job.reject(makeAbortError());continue;}
  activeRequests++;
  lastRequestAt=Date.now();
  runQueuedRequest(job).then(job.resolve,job.reject).finally(()=>{
   activeRequests--;
   pumpRequestQueue();
  });
 }
}

function queuedFetch(url,signal){
 return new Promise((resolve,reject)=>{
  if(signal&&signal.aborted){reject(makeAbortError());return;}
  requestQueue.push({url,signal,resolve,reject});
  pumpRequestQueue();
 });
}

async function runQueuedRequest(job){
 let lastError;
 for(let attempt=0;attempt<2;attempt++){
  if(job.signal&&job.signal.aborted)throw makeAbortError();
  const controller=new AbortController();
  let timedOut=false;
  const onAbort=()=>controller.abort();
  if(job.signal)job.signal.addEventListener('abort',onAbort,{once:true});
  const timeout=setTimeout(()=>{timedOut=true;controller.abort();},REQUEST_TIMEOUT_MS);
  try{
   const response=await fetch(job.url,{cache:'no-store',signal:controller.signal});
   if(response.status===418||response.status===429){
    throw pauseForRateLimit(response.status,response.headers.get('Retry-After'));
   }
   if(response.status>=500&&response.status<=599){
    lastError=new Error('Binance HTTP '+response.status);
    if(attempt===0){await new Promise(r=>setTimeout(r,500));continue;}
    throw lastError;
   }
   if(!response.ok)throw new Error('Binance HTTP '+response.status);
   return await response.json();
  }catch(e){
   if(e instanceof BinanceRateLimitError)throw e;
   if(job.signal&&job.signal.aborted)throw makeAbortError();
   if(timedOut){
    lastError=new Error('Request timed out after 15 seconds');
    if(attempt===0){await new Promise(r=>setTimeout(r,350));continue;}
   }else if(e.name==='AbortError')throw makeAbortError();
   else lastError=e;
   throw lastError;
  }finally{
   clearTimeout(timeout);
   if(job.signal)job.signal.removeEventListener('abort',onAbort);
  }
 }
 throw lastError||new Error('Binance API unavailable');
}

/* Only network-level failures try another Binance host.
   HTTP errors such as 403, 418, 429 and 5xx are not host-switched. */
async function api(path){
 let lastError;
 for(let i=0;i<API.length;i++){
  try{
   return await queuedFetch(API[i]+path,activeController?activeController.signal:null);
  }catch(e){
   if(e instanceof BinanceRateLimitError||
      e.name==='AbortError'||
      /^Binance HTTP \d+/.test(String(e.message||'')))throw e;
   lastError=e;
  }
 }
 throw lastError||new Error('Binance API unavailable');
}

function ema(values,period){
 if(!values.length)return[];
 const multiplier=2/(period+1),result=[];
 let previous=values[0];
 result.push(previous);
 for(let i=1;i<values.length;i++){
  previous=values[i]*multiplier+previous*(1-multiplier);
  result.push(previous);
 }
 return result;
}

function macd(closes){
 const fast=ema(closes,12),slow=ema(closes,26);
 const dif=closes.map((v,i)=>fast[i]-slow[i]);
 const dea=ema(dif,9);
 const hist=dif.map((v,i)=>v-dea[i]);
 return{dif,dea,hist};
}

function calculateRSI(closes,period=14){
 if(closes.length<=period)return null;
 let gain=0,loss=0;
 for(let i=1;i<=period;i++){
  const d=closes[i]-closes[i-1];
  gain+=Math.max(d,0);loss+=Math.max(-d,0);
 }
 let avgGain=gain/period,avgLoss=loss/period;
 for(let i=period+1;i<closes.length;i++){
  const d=closes[i]-closes[i-1];
  avgGain=(avgGain*(period-1)+Math.max(d,0))/period;
  avgLoss=(avgLoss*(period-1)+Math.max(-d,0))/period;
 }
 if(avgLoss===0)return 100;
 return 100-(100/(1+avgGain/avgLoss));
}

function calculateSupertrend(klines,period=10,multiplier=3){
 if(klines.length<period+3)return null;
 const high=klines.map(k=>Number(k[2]));
 const low=klines.map(k=>Number(k[3]));
 const close=klines.map(k=>Number(k[4]));
 const tr=[0];
 for(let i=1;i<close.length;i++){
  tr.push(Math.max(high[i]-low[i],Math.abs(high[i]-close[i-1]),Math.abs(low[i]-close[i-1])));
 }
 let atr=tr.slice(1,period+1).reduce((a,b)=>a+b,0)/period;
 let upper=0,lower=0,trend=1;
 for(let i=period;i<close.length;i++){
  if(i>period)atr=(atr*(period-1)+tr[i])/period;
  const middle=(high[i]+low[i])/2;
  const basicUpper=middle+multiplier*atr;
  const basicLower=middle-multiplier*atr;
  if(i===period){
   upper=basicUpper;lower=basicLower;trend=close[i]>=middle?1:-1;
   continue;
  }
  const previousUpper=upper,previousLower=lower;
  upper=basicUpper<previousUpper||close[i-1]>previousUpper?basicUpper:previousUpper;
  lower=basicLower>previousLower||close[i-1]<previousLower?basicLower:previousLower;
  if(trend===1&&close[i]<lower)trend=-1;
  else if(trend===-1&&close[i]>upper)trend=1;
 }
 return trend===1?'Bullish':'Bearish';
}

/* Uses the latest candle, including the live forming candle. */
function crossoverBar(hist,direction){
 const last=hist.length-1;
 for(let i=last;i>=1;i--){
  if(direction==='bull'&&hist[i]>0&&hist[i-1]<=0)return last-i+1;
  if(direction==='bear'&&hist[i]<0&&hist[i-1]>=0)return last-i+1;
 }
 return null;
}

function rollingVolumeChange(klines,windowSize){
 const completed=klines.filter(k=>Number(k[6])<Date.now());
 if(completed.length<windowSize*2)return null;
 const end=completed.length;
 const current=completed.slice(end-windowSize,end).reduce((sum,k)=>sum+Number(k[7]||0),0);
 const previous=completed.slice(end-windowSize*2,end-windowSize).reduce((sum,k)=>sum+Number(k[7]||0),0);
 if(!Number.isFinite(current)||!Number.isFinite(previous)||previous<=0)return null;
 return ((current-previous)/previous)*100;
}

function rollingOISnapshots(rows,windowMinutes){
 const steps=windowMinutes/5;
 if(!Number.isInteger(steps)||steps<1)return null;
 const valid=(Array.isArray(rows)?rows:[]).filter(r=>Number.isFinite(Number(r.timestamp))&&Number.isFinite(Number(r.sumOpenInterestValue))).sort((a,b)=>Number(a.timestamp)-Number(b.timestamp));
 if(valid.length<=steps)return null;
 const latest=valid[valid.length-1],earlier=valid[valid.length-1-steps];
 const elapsed=Number(latest.timestamp)-Number(earlier.timestamp);
 const expected=windowMinutes*60*1000;
 if(Math.abs(elapsed-expected)>60000)return null;
 const current=Number(latest.sumOpenInterestValue),previous=Number(earlier.sumOpenInterestValue);
 if(!Number.isFinite(current)||!Number.isFinite(previous)||previous<=0)return null;
 return {current,previous,increase:current-previous,change:((current-previous)/previous)*100};
}
function rollingOIChange(rows,windowMinutes){
 const comparison=rollingOISnapshots(rows,windowMinutes);
 return comparison?comparison.change:null;
}

function format(value,decimals=4){
 return Number.isFinite(value)?value.toFixed(decimals):'—';
}

function formatInteger(value){
 return Number.isFinite(value)?Math.round(value).toLocaleString('en-US'):'—';
}

function render(){
 const savedScrollX=window.scrollX,savedScrollY=window.scrollY;
 const makeRow=s=>`<tr><td><b>${s.symbol}</b></td><td>${format(s.price,8)}</td><td>${s.bar}/${s.window}</td><td>${s.rsi===null?"—":format(s.rsi,1)}</td><td>${format(s.change,2)}%</td><td>${s.oiValue===null?"—":formatInteger(s.oiValue)}</td><td>${s.oiChange5m===null?"—":(s.oiChange5m>0?"+":"")+format(s.oiChange5m,2)+"%"}</td><td class="volume-col volume-1h${s.vol1hChange!==null&&s.vol4hChange!==null&&s.vol1hChange>0&&s.vol4hChange>0?" volume-both-positive":s.vol1hChange!==null&&s.vol4hChange!==null&&s.vol1hChange<0&&s.vol4hChange<0?" volume-both-negative":""}">${s.vol1hChange===null?"—":(s.vol1hChange>0?"+":"")+format(s.vol1hChange,2)+"%"}</td><td class="volume-col volume-4h${s.vol1hChange!==null&&s.vol4hChange!==null&&s.vol1hChange>0&&s.vol4hChange>0?" volume-both-positive":s.vol1hChange!==null&&s.vol4hChange!==null&&s.vol1hChange<0&&s.vol4hChange<0?" volume-both-negative":""}">${s.vol4hChange===null?"—":(s.vol4hChange>0?"+":"")+format(s.vol4hChange,2)+"%"}</td><td><span class="${s.hist>0?"hist-positive":s.hist<0?"hist-negative":"hist-zero"}" title="MACD histogram direction">${s.hist>0?"🟢":s.hist<0?"🔴":"—"}</span></td><td><span class="${s.dea>0?"hist-positive":s.dea<0?"hist-negative":"hist-zero"}" title="DEA direction">${s.dea>0?"🟢":s.dea<0?"🔴":"—"}</span></td><td>${s.st||"—"}</td></tr>`;
 const put=(id,rows)=>$(id).innerHTML=rows.length?rows.map(makeRow).join(""):'<tr><td colspan="12" class="empty">No signals found.</td></tr>';
 const bullRows=rows=>rows.filter(s=>($("bullChangeFilter").value==="all"||s.change>0)&&(!$("oiFilterEnabled").checked||(s.oiFilterChange!==null&&s.oiFilterChange>=Number($("oiMinChange").value)))&&(!$("oiValueFilterEnabled").checked||(s.oiValue!==null&&s.oiValue>=Number($("oiMinValue").value)))&&(!$("vol1hFilterEnabled").checked||(s.vol1hChange!==null&&Number.isFinite(Number($("vol1hMinChange").value))&&s.vol1hChange>=Math.max(0,Number($("vol1hMinChange").value))))&&(!$("vol4hFilterEnabled").checked||(s.vol4hChange!==null&&Number.isFinite(Number($("vol4hMinChange").value))&&s.vol4hChange>=Math.max(0,Number($("vol4hMinChange").value)))));
 const bearRows=rows=>rows.filter(s=>($("bearChangeFilter").value==="all"||s.change<0)&&(!$("oiFilterEnabled").checked||(s.oiFilterChange!==null&&s.oiFilterChange>=Number($("oiMinChange").value)))&&(!$("oiValueFilterEnabled").checked||(s.oiValue!==null&&s.oiValue>=Number($("oiMinValue").value)))&&(!$("vol1hFilterEnabled").checked||(s.vol1hChange!==null&&Number.isFinite(Number($("vol1hMinChange").value))&&s.vol1hChange<=-Math.max(0,Number($("vol1hMinChange").value))))&&(!$("vol4hFilterEnabled").checked||(s.vol4hChange!==null&&Number.isFinite(Number($("vol4hMinChange").value))&&s.vol4hChange<=-Math.max(0,Number($("vol4hMinChange").value)))));
 const bull=[lastResults.bullA,lastResults.bullB,lastResults.bullC,lastResults.bullD].map(bullRows);
 const bear=[lastResults.bearA,lastResults.bearB,lastResults.bearC,lastResults.bearD].map(bearRows);
 ["A","B","C","D"].forEach((slot,i)=>{put("bullRows"+slot,bull[i]);put("bearRows"+slot,bear[i]);});
 $("counts").textContent=`Bullish: ${bull.reduce((n,r)=>n+r.length,0)} · Bearish: ${bear.reduce((n,r)=>n+r.length,0)}`;
 $("bullChangeFilter").onchange=render;$("bearChangeFilter").onchange=render;$("oiFilterEnabled").onchange=render;$("oiMinChange").oninput=render;$("oiValueFilterEnabled").onchange=render;$("oiMinValue").oninput=render;$("vol1hFilterEnabled").onchange=render;$("vol1hMinChange").oninput=render;$("vol4hFilterEnabled").onchange=render;$("vol4hMinChange").oninput=render;
 if(window.scrollX!==savedScrollX||window.scrollY!==savedScrollY)window.scrollTo(savedScrollX,savedScrollY);
}

async function workerPool(items,limit,callback,token,onProgress){
 let next=0;
 const workers=Array.from({length:Math.min(limit,items.length)},async()=>{
  while(true){
   if(token!==scanToken||(activeController&&activeController.signal.aborted))return;
   const index=next++;
   if(index>=items.length)return;
   try{await callback(items[index]);}
   catch(e){
    if(e instanceof BinanceRateLimitError||e.name==='AbortError')throw e;
    requestErrors++;
   }
   if(token!==scanToken)return;
   progressDone++;
   $('scanned').textContent='Pairs scanned: '+progressDone+'/'+progressTotal;
   $('state').textContent='Status: Scanning · '+progressDone+'/'+progressTotal+' · '+requestErrors+' request errors';
   if(onProgress)onProgress();
  }
 });
 await Promise.all(workers);
}

async function scan(){
 if(busy||trackerBusy||Date.now()<rateLimitedUntil)return;
 busy=true;
 const token=++scanToken;
 activeController=new AbortController();
 scanStartedAt=performance.now();
 requestErrors=0;progressDone=0;progressTotal=0;
 $('duration').textContent='Elapsed: 0.0s';
 $('state').textContent='Status: Connecting to Binance';
 $('scanned').textContent='Pairs scanned: 0';
 const bullish=[[],[],[],[]],bearish=[[],[],[],[]];
 const diagnostic={bearPrimary:[0,0,0,0],bearMissingConfirmData:0,bearRejectMACD:0,bearRejectSupertrend:0,bearRejectRSI:0,bearRejectDEA:0,bearRejectZeroLine:0,bearPassedConfirmations:0,bearRejectOIChange:0,bearRejectOIValue:0,bearPassedOI:0};
 const elapsedTimer=setInterval(()=>{
  if(token===scanToken&&busy){
   const elapsed=(performance.now()-scanStartedAt)/1000;
   $('duration').textContent='Started: '+new Date(Date.now()-elapsed*1000).toLocaleTimeString()+' · Elapsed: '+elapsed.toFixed(1)+'s';
  }
 },250);
 try{
  const primaryTfs=['A','B','C','D'].map(slot=>$('macdTf'+slot).value);
  if(new Set(primaryTfs).size!==primaryTfs.length)throw new Error('Choose four different Primary MACD timeframes.');
  ['A','B','C','D'].forEach((slot,index)=>{
   $('bullTf'+slot+'Label').textContent=primaryTfs[index]+' Primary MACD';
   $('bearTf'+slot+'Label').textContent=primaryTfs[index]+' Primary MACD';
  });

  const[exchangeInfo,tickers]=await Promise.all([
   api('/fapi/v1/exchangeInfo'),api('/fapi/v1/ticker/24hr')
  ]);
  const eligible=new Set(exchangeInfo.symbols.filter(s=>s.contractType==='PERPETUAL'&&s.quoteAsset==='USDT'&&s.status==='TRADING').map(s=>s.symbol));
  const minVolume=Math.max(0,Number($('minVol').value)||0);
  const market=tickers.filter(t=>eligible.has(t.symbol)&&Number(t.quoteVolume)>=minVolume).map(t=>({
   symbol:t.symbol,price:Number(t.lastPrice),change:Number(t.priceChangePercent),volume:Number(t.quoteVolume)
  }));
  if(!market.length)throw new Error('No eligible pairs found. Check minimum volume.');
  const universe=$('universe').value;
  let bulls=market.slice(),bears=market.slice();
  if(universe!=='all'){
   const n=universe==='custom'?Math.max(1,Math.floor(Number($('customUniverse').value)||1)):Number(universe);
   bulls=market.slice().sort((a,b)=>b.change-a.change).slice(0,n);
   bears=market.slice().sort((a,b)=>a.change-b.change).slice(0,n);
  }
  const bullSet=new Set(bulls.map(x=>x.symbol)),bearSet=new Set(bears.map(x=>x.symbol));
  const symbols=[...new Set([...bullSet,...bearSet])];
  progressTotal=symbols.length;
  $('scanned').textContent='Pairs scanned: 0/'+progressTotal;
  const marketMap=new Map(market.map(x=>[x.symbol,x]));
  const deaTf=$('deaTf').value;
  const deaConfirmTfs=['1m','3m','5m','15m','30m','1h','4h'].filter(tf=>$('deaConfirm_'+tf).checked);
  const macdConfirmTfs=['1m','3m','5m','15m','30m','1h','4h'].filter(tf=>$('macdConfirm_'+tf).checked);
  const stConfirmTfs=['1m','3m','5m','15m','30m','1h','2h','4h'].filter(tf=>$('stConfirm_'+tf).checked);
  const rsiConfirmTfs=['1m','3m','5m','15m','30m','1h','2h','4h'].filter(tf=>$('rsiEnable_'+tf).checked);

  for(const tf of rsiConfirmTfs){
   const values=['rsiBullMin_','rsiBullMax_','rsiBearMin_','rsiBearMax_'].map(prefix=>Number($(prefix+tf).value));
   if(values.some(v=>!Number.isFinite(v)||v<0||v>100)||values[0]>values[1]||values[2]>values[3]){
    throw new Error('Invalid RSI range for '+tf+'. Use values from 0 to 100 and ensure each minimum is not above its maximum.');
   }
  }

  const filterDifZero=$('filterDifZero').checked,filterDeaZero=$('filterDeaZero').checked;
  const requestedWindow=Math.floor(Number($('crossWindow').value)||10);
  const crossWindow=Math.max(3,Math.min(30,requestedWindow));
  $('crossWindow').value=crossWindow;
  $('state').textContent='Status: Scanning '+symbols.length+' pairs across '+primaryTfs.join(', ');

  await workerPool(symbols,MAX_WORKERS,async symbol=>{
   /* STAGE 1: Fetch each primary timeframe once. */
   const data={};
   await Promise.all(primaryTfs.map(async tf=>{
    const raw=await api(`/fapi/v1/klines?symbol=${symbol}&interval=${tf}&limit=100`);
    data[tf]=raw;
   }));
   const candidates=[];
   for(let index=0;index<primaryTfs.length;index++){
    const tf=primaryTfs[index],klines=data[tf];
    if(klines.length<35)continue;
    const values=macd(klines.map(k=>Number(k[4])));
    const current=values.hist.length-1;
    const bullBar=crossoverBar(values.hist,'bull');
    const bearBar=crossoverBar(values.hist,'bear');
    if(bullSet.has(symbol)&&bullBar!==null&&bullBar>=1&&bullBar<=crossWindow){
     candidates.push({slot:index,direction:'bull',bar:bullBar,values,current});
    }
    if(bearSet.has(symbol)&&bearBar!==null&&bearBar>=1&&bearBar<=crossWindow){
     diagnostic.bearPrimary[index]++;
     candidates.push({slot:index,direction:'bear',bar:bearBar,values,current});
    }
   }
   /* No recent crossover on either primary timeframe: skip all confirmations. */
   if(!candidates.length)return;

   /* STAGE 2: Fetch the union of enabled confirmations once per coin. */
   const intervals=new Set([...deaConfirmTfs,...macdConfirmTfs,...stConfirmTfs,...rsiConfirmTfs]);
   if(filterDifZero||filterDeaZero)intervals.add(deaTf);
   for(const tf of primaryTfs)intervals.delete(tf);
   await Promise.all([...intervals].map(async tf=>{
    const raw=await api(`/fapi/v1/klines?symbol=${symbol}&interval=${tf}&limit=100`);
    data[tf]=raw;
   }));

   const noteMissingBearConfirmData=()=>{diagnostic.bearMissingConfirmData+=candidates.filter(c=>c.direction==='bear').length;};
   let zeroDif=null,zeroDea=null;
   if(filterDifZero||filterDeaZero){
    const deaKlines=data[deaTf];
    if(!deaKlines||deaKlines.length<35){noteMissingBearConfirmData();return;}
    const deaValues=macd(deaKlines.map(k=>Number(k[4])));
    const zi=deaValues.dea.length-1;
    zeroDif=deaValues.dif[zi];zeroDea=deaValues.dea[zi];
   }

   const deaConfirm={},macdConfirm={},stConfirm={},rsiConfirm={};
   for(const tf of deaConfirmTfs){
    if(!data[tf]||data[tf].length<35){noteMissingBearConfirmData();return;}
    const values=macd(data[tf].map(k=>Number(k[4])));
    deaConfirm[tf]=values.dea[values.dea.length-1];
   }
   for(const tf of macdConfirmTfs){
    if(!data[tf]||data[tf].length<35){noteMissingBearConfirmData();return;}
    const values=macd(data[tf].map(k=>Number(k[4])));
    macdConfirm[tf]=values.hist[values.hist.length-1];
   }
   for(const tf of stConfirmTfs){
    if(!data[tf]||data[tf].length<13){noteMissingBearConfirmData();return;}
    stConfirm[tf]=calculateSupertrend(data[tf]);
   }
   for(const tf of rsiConfirmTfs){
    if(!data[tf]||data[tf].length<15){noteMissingBearConfirmData();return;}
    rsiConfirm[tf]=calculateRSI(data[tf].map(k=>Number(k[4])));
   }

   const item=marketMap.get(symbol);
   if(!item)return;
   const passingCandidates=[];
   for(const candidate of candidates){
    const bullish=candidate.direction==='bull';
    const macdPass=macdConfirmTfs.every(tf=>bullish?macdConfirm[tf]>0:macdConfirm[tf]<0);
    const stPass=stConfirmTfs.every(tf=>stConfirm[tf]===(bullish?'Bullish':'Bearish'));
    const rsiPass=rsiConfirmTfs.every(tf=>{const value=rsiConfirm[tf];const min=Number($((bullish?'rsiBullMin_':'rsiBearMin_')+tf).value);const max=Number($((bullish?'rsiBullMax_':'rsiBearMax_')+tf).value);return value!==null&&value>=min&&value<=max;});
    const difZeroPass=!filterDifZero||(bullish?zeroDif>0:zeroDif<0);
    const deaZeroPass=!filterDeaZero||(bullish?zeroDea>0:zeroDea<0);
    const deaPass=deaConfirmTfs.every(tf=>bullish?deaConfirm[tf]>0:deaConfirm[tf]<0);
    if(!bullish){
     if(!macdPass)diagnostic.bearRejectMACD++;
     if(!stPass)diagnostic.bearRejectSupertrend++;
     if(!rsiPass)diagnostic.bearRejectRSI++;
     if(!deaPass)diagnostic.bearRejectDEA++;
     if(!difZeroPass||!deaZeroPass)diagnostic.bearRejectZeroLine++;
    }
    if(macdPass&&rsiPass&&stPass&&deaPass&&difZeroPass&&deaZeroPass){
     passingCandidates.push(candidate);
     if(!bullish)diagnostic.bearPassedConfirmations++;
    }
   }
   if(!passingCandidates.length)return;
   let oiValue=null,oiChange5m=null,oiFilterChange=null,oiIncrease5m=null;
   try{
    const oiWindowMinutes=Number($('oiTf').value);
    const oiRows=await api('/futures/data/openInterestHist?symbol='+encodeURIComponent(symbol)+'&period=5m&limit=4');
    if(Array.isArray(oiRows)&&oiRows.length){
     const latest=oiRows.reduce((a,b)=>Number(a.timestamp)>Number(b.timestamp)?a:b);
     oiValue=Number(latest.sumOpenInterestValue);
     const oi5mComparison=rollingOISnapshots(oiRows,5);
     oiIncrease5m=oi5mComparison?oi5mComparison.increase:null;
     oiChange5m=oi5mComparison?oi5mComparison.change:null;
     oiFilterChange=rollingOIChange(oiRows,oiWindowMinutes);
     if(!Number.isFinite(oiValue))oiValue=null;
    }
   }catch(e){if(e instanceof BinanceRateLimitError||e.name==='AbortError')throw e;}
   const oi5mAbsOn=$('oi5mAbsFilterEnabled').checked,oi5mAbsMinimum=Number($('oi5mAbsMin').value);
   const oi5mPctOn=$('oi5mPctFilterEnabled').checked,oi5mPctMinimum=Number($('oi5mPctMin').value);
   const oi5mAbsFail=oi5mAbsOn&&(oiIncrease5m===null||!Number.isFinite(oi5mAbsMinimum)||oi5mAbsMinimum<0||oiIncrease5m<oi5mAbsMinimum);
   const oi5mPctFail=oi5mPctOn&&(oiChange5m===null||!Number.isFinite(oi5mPctMinimum)||oi5mPctMinimum<0||oiChange5m<oi5mPctMinimum);
   const oiFilterOn=$('oiFilterEnabled').checked,oiMinimum=Number($('oiMinChange').value);const oiValueFilterOn=$('oiValueFilterEnabled').checked,oiValueMinimum=Number($('oiMinValue').value);
   if(oiFilterOn&&(oiFilterChange===null||!Number.isFinite(oiMinimum)||oiFilterChange<oiMinimum))diagnostic.bearRejectOIChange+=passingCandidates.filter(c=>c.direction==='bear').length;
   if(oiValueFilterOn&&(oiValue===null||!Number.isFinite(oiValueMinimum)||oiValue<oiValueMinimum))diagnostic.bearRejectOIValue+=passingCandidates.filter(c=>c.direction==='bear').length;
   const oiPassingCandidates=passingCandidates.filter(()=>!oi5mAbsFail&&!oi5mPctFail&&!(oiFilterOn&&(oiFilterChange===null||!Number.isFinite(oiMinimum)||oiFilterChange<oiMinimum))&&!(oiValueFilterOn&&(oiValue===null||!Number.isFinite(oiValueMinimum)||oiValue<oiValueMinimum)));
   diagnostic.bearPassedOI+=oiPassingCandidates.filter(c=>c.direction==='bear').length;
   if(!oiPassingCandidates.length)return;
   /* One 1m-kline request supplies both rolling volume windows for this symbol. */
   const volumeKlines=await api('/fapi/v1/klines?symbol='+encodeURIComponent(symbol)+'&interval=1m&limit=1000');
   const vol1hChange=rollingVolumeChange(volumeKlines,60);
   const vol4hChange=rollingVolumeChange(volumeKlines,240);
   for(const candidate of oiPassingCandidates){
    const result={symbol,price:item.price,bar:candidate.bar,window:crossWindow,hist:candidate.values.hist[candidate.current],dea:candidate.values.dea[candidate.current],rsi:rsiConfirmTfs.length?rsiConfirm[rsiConfirmTfs[0]]:null,st:stConfirmTfs.length?stConfirm[stConfirmTfs[0]]:'—',change:item.change,oiValue,oiChange5m,oiFilterChange,oiIncrease5m,vol1hChange,vol4hChange};
    (candidate.direction==='bull'?bullish:bearish)[candidate.slot].push(result);
   }
  },token);

  if(token===scanToken){
   lastResults={};
   ['A','B','C','D'].forEach((slot,index)=>{
    lastResults['bull'+slot]=bullish[index].sort((a,b)=>a.bar-b.bar);
    lastResults['bear'+slot]=bearish[index].sort((a,b)=>a.bar-b.bar);
   });
   render();
   $('bearDiagnostics').textContent='Bearish diagnostics (this scan): Primary crossovers — '+diagnostic.bearPrimary.map((count,index)=>count+' on '+primaryTfs[index]).join(' / ')+'; missing confirmation data — '+diagnostic.bearMissingConfirmData+'; rejected by MACD — '+diagnostic.bearRejectMACD+'; Supertrend — '+diagnostic.bearRejectSupertrend+'; RSI — '+diagnostic.bearRejectRSI+'; DEA — '+diagnostic.bearRejectDEA+'; DIF/DEA zero-line — '+diagnostic.bearRejectZeroLine+'; passed confirmations — '+diagnostic.bearPassedConfirmations+'; rejected by OI change — '+diagnostic.bearRejectOIChange+'; rejected by OI value — '+diagnostic.bearRejectOIValue+'; passed OI stage — '+diagnostic.bearPassedOI+'; displayed — '+bearish.reduce((n,rows)=>n+rows.length,0)+'. Rejection counts can overlap when multiple confirmations fail.';
   $('state').textContent='Status: Scan complete · '+requestErrors+' request errors';
   $('updated').textContent='Updated: '+new Date().toLocaleTimeString();
  }
 }catch(error){
  if(error instanceof BinanceRateLimitError)$('state').textContent=error.message;
  else if(error.name==='AbortError'){if(token===scanToken)$('state').textContent='Status: Scan stopped';}
  else if(token===scanToken){requestErrors++;$('state').textContent='Error: '+error.message+' · '+requestErrors+' request errors';}
 }finally{
  clearInterval(elapsedTimer);
  if(token===scanToken){
   const seconds=(performance.now()-scanStartedAt)/1000;
   $('duration').textContent='Started: '+new Date(Date.now()-seconds*1000).toLocaleTimeString()+' · Finished: '+new Date().toLocaleTimeString()+' · '+seconds.toFixed(1)+'s · '+(seconds>0?(progressDone/seconds).toFixed(2):'0')+' pairs/sec';
   $('scanned').textContent='Pairs scanned: '+progressDone+'/'+progressTotal;
   busy=false;
   activeController=null;
   if(running&&Number($('refresh').value)>0&&Date.now()>=rateLimitedUntil){
    if(timer){clearTimeout(timer);clearInterval(timer);}
    timer=setTimeout(()=>{if(running&&!busy)scan();},Number($('refresh').value)*1000);
   }
  }
 }
}


let trackerBusy=false,trackerToken=0,trackerResults=[],trackerErrors=0;
const TRACKER_SHORT_TFS=['1m','3m','5m','15m'];
const TRACKER_CONFIRM_TFS=['15m','30m','1h'];
function barsSincePositive(values){
 const h=values.hist, last=h.length-1;
 if(last<1||!Number.isFinite(h[last])||h[last]<=0)return null;
 for(let i=last;i>=1;i--){
  if(h[i]>0&&h[i-1]<=0)return last-i+1;
 }
 return null;
}
function barsSinceBullCross(values){
 const last=values.dif.length-1;
 if(last<1)return null;
 for(let i=last;i>=1;i--){
  if(values.dif[i]>values.dea[i]&&values.dif[i-1]<=values.dea[i-1])return last-i+1;
 }
 return null;
}
function trackerMacdState(raw){
 const values=macd(raw.map(k=>Number(k[4])));
 const i=values.hist.length-1;
 return {hist:values.hist[i],dif:values.dif[i],dea:values.dea[i],
  histBars:barsSincePositive(values),crossBars:barsSinceBullCross(values)};
}
function trackerEventPass(state,tf){
 const max=Math.max(1,Math.min(10,Math.floor(Number($('trackBars_'+tf).value)||1)));
 $('trackBars_'+tf).value=max;
 const histOn=$('trackHist_'+tf).checked;
 const crossOn=$('trackCross_'+tf).checked;
 return (histOn&&state.hist>0&&state.histBars!==null&&state.histBars<=max)||
  (crossOn&&state.crossBars!==null&&state.crossBars<=max);
}
function trackerFormat(value,digits=6){
 return Number.isFinite(value)?value.toLocaleString('en-US',{maximumFractionDigits:digits}):'—';
}
function renderTracker(){
 const body=$('trackerResults');
 if(!trackerResults.length){
  body.innerHTML='<tr><td colspan="11" class="empty">No coins matched the selected MACD events and confirmation settings.</td></tr>';
  return;
 }
 body.innerHTML=trackerResults.map(row=>{
  const cell=(tf,key)=>{const v=row.states[tf];if(!v)return '—';if(key==='hist')return '<span class="'+(v.hist>0?'tracker-positive':'tracker-negative')+'">'+trackerFormat(v.hist)+'</span>'+(v.histBars!==null?' · '+v.histBars+' bars':'');return trackerFormat(v.dif)+' / '+trackerFormat(v.dea);};
  return '<tr><td><b>'+row.symbol+'</b></td><td>'+trackerFormat(row.change,2)+'%</td>'+
   TRACKER_SHORT_TFS.map(tf=>'<td>'+cell(tf,'hist')+'</td><td>'+cell(tf,'dif')+'</td>').join('')+
   '<td>'+(row.confirmation||'Not selected')+'</td></tr>';
 }).join('');
}
async function scanMacdTracker(){
 if(trackerBusy||busy||Date.now()<rateLimitedUntil)return;
 const enabled=TRACKER_SHORT_TFS.filter(tf=>$('trackHist_'+tf).checked||$('trackCross_'+tf).checked);
 if(!enabled.length){$('trackerState').textContent='Status: Enable at least one event on a short timeframe.';return;}
 trackerBusy=true;
 const token=++trackerToken;
 activeController=new AbortController();
 trackerResults=[];trackerErrors=0;
 $('trackerState').textContent='Status: Loading Binance market';
 $('trackerCount').textContent='Coins checked: 0';
 $('trackerUpdated').textContent='Updated: —';
 try{
  const [exchangeInfo,tickers]=await Promise.all([api('/fapi/v1/exchangeInfo'),api('/fapi/v1/ticker/24hr')]);
  const eligible=new Set(exchangeInfo.symbols.filter(x=>x.contractType==='PERPETUAL'&&x.quoteAsset==='USDT'&&x.status==='TRADING').map(x=>x.symbol));
  const minVol=Math.max(0,Number($('trackerMinVolume').value)||0);
  let market=tickers.filter(x=>eligible.has(x.symbol)&&Number(x.quoteVolume)>=minVol);
  const mode=$('trackerUniverse').value;
  if(mode==='gainers')market.sort((a,b)=>Number(b.priceChangePercent)-Number(a.priceChangePercent));
  else if(mode==='losers')market.sort((a,b)=>Number(a.priceChangePercent)-Number(b.priceChangePercent));
  else market.sort((a,b)=>Math.abs(Number(b.priceChangePercent))-Math.abs(Number(a.priceChangePercent)));
  const selected=market.slice(0,20);
  $('trackerState').textContent='Status: Checking '+selected.length+' top performers';
  const settled=await Promise.allSettled(selected.map(async ticker=>{
   const symbol=ticker.symbol,states={};
   const needed=new Set(TRACKER_SHORT_TFS);
   const confirmTfs=TRACKER_CONFIRM_TFS.filter(tf=>$('trackerConfirm_'+tf).checked);
   for(const tf of confirmTfs)if(!needed.has(tf))needed.add(tf);
   const entries=await Promise.all([...needed].map(async tf=>{
    const raw=await api('/fapi/v1/klines?symbol='+encodeURIComponent(symbol)+'&interval='+tf+'&limit=80');
    if(!Array.isArray(raw)||raw.length<35)throw new Error('Insufficient '+tf+' candles for '+symbol);
    return [tf,trackerMacdState(raw)];
   }));
   entries.forEach(([tf,state])=>states[tf]=state);
   const matching=TRACKER_SHORT_TFS.filter(tf=>enabled.includes(tf)&&trackerEventPass(states[tf],tf));
   if(!matching.length)return null;
   let confirmation='Not selected';
   if(confirmTfs.length){
    const passing=confirmTfs.filter(tf=>states[tf]&&states[tf].hist>0&&states[tf].dif>0&&states[tf].dea>0);
    if(!passing.length)return null;
    confirmation='Bullish: '+passing.join(', ');
   }
   return {symbol,change:Number(ticker.priceChangePercent),states,matching,confirmation};
  }));
  if(token!==trackerToken)return;
  const checked=settled.map(item=>{if(item.status==='rejected'){trackerErrors++;return null;}return item.value;});
  trackerResults=checked.filter(Boolean).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));
  renderTracker();
  $('trackerCount').textContent='Coins checked: '+selected.length+' · Matches: '+trackerResults.length+' · Request errors: '+trackerErrors;
  $('trackerState').textContent=trackerErrors?'Status: Scan complete with some pair errors':'Status: Scan complete';
  $('trackerUpdated').textContent='Updated: '+new Date().toLocaleTimeString();
 }catch(error){
  if(token===trackerToken)$('trackerState').textContent=error.name==='AbortError'?'Status: Stopped':'Error: '+error.message;
 }finally{
  if(token===trackerToken){trackerBusy=false;activeController=null;}
 }
}
function stopMacdTracker(){
 if(!trackerBusy)return;
 trackerToken++;
 trackerBusy=false;
 if(activeController&&!activeController.signal.aborted)activeController.abort();
 activeController=null;
 $('trackerState').textContent='Status: Stopped';
}
function switchScannerTab(which){
 const main=which==='main';
 $('mainScannerTab').hidden=!main;
 $('macdTrackerTab').hidden=main;
 $('mainTabButton').classList.toggle('active',main);
 $('trackerTabButton').classList.toggle('active',!main);
}

const PRESET_STORAGE_KEY='binanceMacdScannerPresets_v1';
const PRESET_CONTROL_IDS=[
 'macdTfA','macdTfB','macdTfC','macdTfD','deaTf','universe','customUniverse','minVol','crossWindow','refresh',
 'filterDifZero','filterDeaZero','oi5mAbsFilterEnabled','oi5mAbsMin','oi5mPctFilterEnabled','oi5mPctMin','oiTf','oiFilterEnabled','oiMinChange','oiValueFilterEnabled','oiMinValue',
  'vol1hFilterEnabled','vol1hMinChange','vol4hFilterEnabled','vol4hMinChange',
 ...['1m','3m','5m','15m','30m','1h','4h'].flatMap(tf=>['deaConfirm_'+tf,'macdConfirm_'+tf]),
 ...['1m','3m','5m','15m','30m','1h','2h','4h'].flatMap(tf=>['stConfirm_'+tf,'rsiEnable_'+tf]),
 ...['1m','3m','5m','15m','30m','1h','2h','4h'].flatMap(tf=>['rsiBullMin_'+tf,'rsiBullMax_'+tf,'rsiBearMin_'+tf,'rsiBearMax_'+tf])
];

function readPresets(){
 try{
  const p=JSON.parse(localStorage.getItem(PRESET_STORAGE_KEY)||'{}');
  return p&&typeof p==='object'&&!Array.isArray(p)?p:{};
 }catch(e){return {};}
}
function writePresets(p){
 try{localStorage.setItem(PRESET_STORAGE_KEY,JSON.stringify(p));return true;}
 catch(e){$('presetStatus').textContent='Could not save presets. Browser storage may be unavailable.';return false;}
}
function refreshPresetList(selected){
 const p=readPresets(),list=$('presetList');
 list.innerHTML='<option value="">Select a saved preset</option>';
 Object.keys(p).sort((a,b)=>a.localeCompare(b)).forEach(name=>{
  const o=document.createElement('option');o.value=name;o.textContent=name;list.appendChild(o);
 });
 if(selected&&p[selected])list.value=selected;
}
function captureSettings(){
 const data={};
 PRESET_CONTROL_IDS.forEach(id=>{
  const el=$(id);
  if(el)data[id]=el.type==='checkbox'?el.checked:el.value;
 });
 return data;
}
function applySettings(data){
 PRESET_CONTROL_IDS.forEach(id=>{
  const el=$(id);
  if(!el||!Object.prototype.hasOwnProperty.call(data,id))return;
  if(el.type==='checkbox')el.checked=!!data[id];
  else el.value=String(data[id]);
 });
 $('customUniverse').disabled=$('universe').value!=='custom';
}
function saveCurrentPreset(){
 const name=$('presetName').value.trim();
 if(!name){$('presetStatus').textContent='Enter a name for this preset first.';return;}
 const p=readPresets();
 p[name]={settings:captureSettings(),savedAt:new Date().toISOString()};
 if(!writePresets(p))return;
 refreshPresetList(name);
 $('presetStatus').textContent='Saved "'+name+'".';
}
function loadSelectedPreset(){
 const name=$('presetList').value,p=readPresets()[name];
 if(!name||!p){$('presetStatus').textContent='Select a saved preset to load.';return;}
 applySettings(p.settings||{});
 $('presetName').value=name;
 $('presetStatus').textContent='Loaded "'+name+'". No scan has been started.';
}
function deleteSelectedPreset(){
 const name=$('presetList').value;
 if(!name){$('presetStatus').textContent='Select a saved preset to delete.';return;}
 const p=readPresets();
 delete p[name];
 if(!writePresets(p))return;
 
refreshPresetList();
 $('presetStatus').textContent='Deleted "'+name+'".';
}
function loadDefaultPresetIfSelected(){
 try{
  const name=localStorage.getItem(PRESET_STORAGE_KEY+'_default');
  if(!name)return;
  const p=readPresets()[name];
  if(p){applySettings(p.settings||{});$('presetName').value=name;}
 }catch(e){$('presetStatus').textContent='Browser storage is unavailable; presets cannot be loaded.';}
}

function stopScanner(){
 running=false;
 scanToken++;
 busy=false;
 $('startBtn').classList.remove('scanning');
 $('startBtn').textContent='Start scanning';
 if(timer){clearTimeout(timer);clearInterval(timer);timer=null;}
 clearQueuedRequests(makeAbortError());
 if(activeController&&!activeController.signal.aborted)activeController.abort();
 activeController=null;
 $('state').textContent='Status: Stopped';
}
function startScanner(){
 stopScanner();
 running=true;
 $('startBtn').classList.add('scanning');
 $('startBtn').textContent='SCANNING…';
 scan();
}

$('startBtn').addEventListener('click',startScanner);
$('onceBtn').addEventListener('click',()=>{
 if(!busy){
  running=false;
  if(timer){clearTimeout(timer);clearInterval(timer);timer=null;}
  scan();
 }
});
$('stopBtn').addEventListener('click',stopScanner);
$('clearBtn').addEventListener('click',()=>{
 lastResults={bullA:[],bullB:[],bullC:[],bullD:[],bearA:[],bearB:[],bearC:[],bearD:[]};render();
 $('scanned').textContent='Pairs scanned: 0';
 $('state').textContent='Status: Results cleared';
});
$('universe').addEventListener('change',()=>{
 $('customUniverse').disabled=$('universe').value!=='custom';
});
$('refresh').addEventListener('change',()=>{
 if(running){
  if(timer){clearTimeout(timer);clearInterval(timer);timer=null;}
  if(!busy&&Number($('refresh').value)>0){
   timer=setTimeout(()=>{if(running&&!busy)scan();},Number($('refresh').value)*1000);
  }
 }
});

$('savePresetBtn').addEventListener('click',saveCurrentPreset);
$('loadPresetBtn').addEventListener('click',loadSelectedPreset);
$('deletePresetBtn').addEventListener('click',deleteSelectedPreset);
$('loadDefaultPreset').addEventListener('change',()=>{
 try{
  const name=$('presetList').value;
  if($('loadDefaultPreset').checked&&name)localStorage.setItem(PRESET_STORAGE_KEY+'_default',name);
  else localStorage.removeItem(PRESET_STORAGE_KEY+'_default');
 }catch(e){$('presetStatus').textContent='Could not update default preset.';}
});
$('presetList').addEventListener('change',()=>{
 try{$('loadDefaultPreset').checked=localStorage.getItem(PRESET_STORAGE_KEY+'_default')===$('presetList').value;}
 catch(e){$('loadDefaultPreset').checked=false;}
});
$('mainTabButton').addEventListener('click',()=>switchScannerTab('main'));
$('trackerTabButton').addEventListener('click',()=>switchScannerTab('tracker'));
$('trackerScanBtn').addEventListener('click',scanMacdTracker);
$('trackerStopBtn').addEventListener('click',stopMacdTracker);
$('trackerClearBtn').addEventListener('click',()=>{trackerResults=[];renderTracker();$('trackerCount').textContent='Coins checked: 0';$('trackerState').textContent='Status: Results cleared';});


refreshPresetList();
loadDefaultPresetIfSelected();
try{$('loadDefaultPreset').checked=!!localStorage.getItem(PRESET_STORAGE_KEY+'_default');}
catch(e){$('loadDefaultPreset').checked=false;}
render();
})();
</script>
</body>
</html>
